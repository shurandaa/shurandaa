<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260">
  <defs>
    <clipPath id="card">
      <rect x="6" y="6" width="888" height="248" rx="32"/>
    </clipPath>
    <style>
      .title { font: 800 44px "Comic Sans MS", "Chalkboard SE", "Marker Felt", cursive; fill: #5C4630; }
      .sub   { font: 600 20px "Comic Sans MS", "Chalkboard SE", "Marker Felt", cursive; fill: #7A6245; }
      .pill  { font: 700 16px "Comic Sans MS", "Chalkboard SE", "Marker Felt", cursive; fill: #FFF8EC; }
      .line  { stroke: #5C4630; stroke-width: 4; stroke-linejoin: round; stroke-linecap: round; }
      .float1 { animation: float 4s ease-in-out infinite; }
      .float2 { animation: float 5s ease-in-out infinite 1s; }
      .twinkle { animation: twinkle 2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .t2 { animation-delay: .7s; }
      .t3 { animation-delay: 1.4s; }
      .wave { animation: wave 1.6s ease-in-out infinite; transform-origin: 780px 205px; }
      .blink { animation: blink 4s infinite; transform-box: fill-box; transform-origin: center; }
      @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
      @keyframes twinkle { 0%,100% { transform: scale(1); opacity: 1; } 50% { transform: scale(.5); opacity: .4; } }
      @keyframes wave { 0%,100% { transform: rotate(-12deg); } 50% { transform: rotate(18deg); } }
      @keyframes blink { 0%,92%,100% { transform: scaleY(1); } 96% { transform: scaleY(.1); } }
    </style>
  </defs>

  <!-- card background -->
  <rect x="6" y="6" width="888" height="248" rx="32" fill="#EFE4CC"/>

  <g clip-path="url(#card)">
    <!-- polka dots -->
    <g fill="#E3D4B4">
      <circle cx="40" cy="40" r="6"/><circle cx="120" cy="30" r="4"/><circle cx="560" cy="36" r="5"/>
      <circle cx="610" cy="210" r="4"/><circle cx="480" cy="230" r="6"/><circle cx="860" cy="60" r="5"/>
    </g>

    <!-- sun -->
    <g class="float2">
      <circle cx="850" cy="55" r="26" fill="#F2C57C" class="line"/>
      <path d="M840 52 q3 -4 6 0 M854 52 q3 -4 6 0 M842 62 q8 7 16 0" fill="none" class="line" stroke-width="3"/>
    </g>

    <!-- clouds -->
    <g class="float1">
      <path d="M400 185 a18 18 0 0 1 30 -12 a22 22 0 0 1 40 6 a16 16 0 0 1 4 30 h-72 a14 14 0 0 1 -2 -24 z" fill="#FFF8EC" class="line"/>
    </g>
    <g class="float2">
      <path d="M560 125 a13 13 0 0 1 22 -9 a16 16 0 0 1 29 5 a12 12 0 0 1 3 22 h-52 a10 10 0 0 1 -2 -18 z" fill="#FFF8EC" class="line" stroke-width="3"/>
    </g>

    <!-- stars -->
    <g fill="#F2C57C" class="line" stroke-width="3">
      <path class="twinkle" d="M585 45 l5 10 11 2 -8 8 2 11 -10 -5 -10 5 2 -11 -8 -8 11 -2 z"/>
      <path class="twinkle t2" d="M640 60 l3 7 7 1 -5 5 1 7 -6 -3 -6 3 1 -7 -5 -5 7 -1 z"/>
      <path class="twinkle t3" d="M350 35 l3 7 7 1 -5 5 1 7 -6 -3 -6 3 1 -7 -5 -5 7 -1 z"/>
    </g>

    <!-- hills -->
    <path d="M0 230 q120 -40 250 -5 t260 0 t260 -10 t200 0 v60 h-980 z" fill="#C3B091" class="line"/>
    <path d="M0 250 q150 -25 300 0 t300 -5 t320 0 v30 h-940 z" fill="#A8946F" class="line"/>

    <!-- bear body -->
    <ellipse cx="720" cy="262" rx="70" ry="55" fill="#B08D63" class="line"/>
    <ellipse cx="720" cy="270" rx="38" ry="32" fill="#F3E3C3" class="line" stroke-width="3"/>

    <!-- waving arm -->
    <g class="wave">
      <path d="M770 215 q20 -30 22 -58" fill="none" stroke="#5C4630" stroke-width="30" stroke-linecap="round"/>
      <path d="M770 215 q20 -30 22 -58" fill="none" stroke="#B08D63" stroke-width="22" stroke-linecap="round"/>
      <circle cx="792" cy="152" r="5" fill="#F3E3C3"/>
    </g>

    <!-- bear head -->
    <circle cx="672" cy="92" r="22" fill="#B08D63" class="line"/>
    <circle cx="672" cy="92" r="11" fill="#E9B8A0"/>
    <circle cx="768" cy="92" r="22" fill="#B08D63" class="line"/>
    <circle cx="768" cy="92" r="11" fill="#E9B8A0"/>
    <circle cx="720" cy="142" r="64" fill="#B08D63" class="line"/>
    <ellipse cx="720" cy="164" rx="28" ry="20" fill="#F3E3C3" class="line" stroke-width="3"/>
    <ellipse cx="720" cy="154" rx="9" ry="6" fill="#5C4630"/>
    <path d="M720 160 v6 M710 168 q10 8 20 0" fill="none" class="line" stroke-width="3"/>
    <g class="blink">
      <ellipse cx="696" cy="130" rx="6" ry="8" fill="#3E2E1E"/>
      <ellipse cx="744" cy="130" rx="6" ry="8" fill="#3E2E1E"/>
    </g>
    <circle cx="698" cy="127" r="2" fill="#FFF"/>
    <circle cx="746" cy="127" r="2" fill="#FFF"/>
    <ellipse cx="678" cy="158" rx="10" ry="6" fill="#E89C8C" opacity=".7"/>
    <ellipse cx="762" cy="158" rx="10" ry="6" fill="#E89C8C" opacity=".7"/>
  </g>

  <!-- text -->
  <text x="60" y="100" class="title">Hi there, I'm Shuran!</text>
  <text x="62" y="140" class="sub">MS CS @ Northeastern · Seattle · AI Agents</text>
  <rect x="60" y="160" width="260" height="36" rx="18" fill="#8B6F47" class="line" stroke-width="3"/>
  <text x="190" y="184" text-anchor="middle" class="pill">Welcome to my cozy corner</text>

  <!-- card outline on top -->
  <rect x="6" y="6" width="888" height="248" rx="32" fill="none" class="line" stroke-width="6"/>
</svg>
